name: Moderate

# Run it by hand from the Actions tab.
# - rename: rename an offensive leaderboard name everywhere it shows (scores are kept).
#   Leave "new name" empty to use "Player 1234".
# - send code: a player lost their 4-digit code. The code is sent to your phone (ntfy),
#   never printed here (this log is public).
# - give back: someone took over a name. Moves the player's scores, streak and rooms to a
#   fresh account with a new code (sent to your phone). Whoever had the name is signed out;
#   give the rightful player the new code and they type their name, then the code.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Player name'
        required: true
      action:
        description: 'What to do'
        type: choice
        options: [rename, send code, give back]
        default: rename
      new_name:
        description: 'New name (rename only, optional)'
        required: false

permissions:
  contents: read

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        env:
          KEY: ${{ secrets.NTFY_TOPIC }}
          TOKEN: ${{ secrets.NTFY_TOKEN }}
          NAME: ${{ inputs.name }}
          ACTION: ${{ inputs.action }}
          TO: ${{ inputs.new_name }}
        run: |
          body=$(jq -n --arg key "$KEY" --arg name "$NAME" --arg action "$ACTION" --arg to "$TO" \
            '{key: $key, name: $name, action: $action} + (if $to == "" or $action != "rename" then {} else {to: $to} end)')
          res=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/json' -d "$body" \
            https://word-game-leaderboard.danlagstein.workers.dev/api/admin/moderate)
          status=$(tail -n1 <<<"$res"); json=$(sed '$d' <<<"$res")
          if [ "$ACTION" = rename ] || [ "$status" != 200 ]; then
            # Rename results and errors hold no secrets.
            jq 'del(.code)' <<<"$json" 2>/dev/null || echo "$json"
            echo "HTTP $status"; [ "$status" = 200 ]; exit
          fi
          code=$(jq -r .code <<<"$json"); echo "::add-mask::$code"
          player=$(jq -r .name <<<"$json")
          msg="Code for $player: $code. They type their name, then this code. Send it only to them."
          [ "$ACTION" = "give back" ] && msg="$player was moved to a fresh account; whoever else had it is signed out. New code: $code. They type their name, then this code."
          auth=()
          [ -n "$TOKEN" ] && auth=(-H "Authorization: Bearer $TOKEN")
          jq -n --arg topic "$KEY" --arg title "Player code" --arg message "$msg" '{topic: $topic, title: $title, message: $message, tags: ["key"]}' |
            curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d @- https://ntfy.sh/ > /dev/null
          echo "Done: the code was sent to your phone."
