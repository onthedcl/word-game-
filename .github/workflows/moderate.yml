name: Moderate

# Run it by hand from the Actions tab.
# - rename: rename an offensive leaderboard name everywhere it shows (scores are kept).
#   Leave "new name" empty to use "Player 1234".
# - send code: a player lost their 4-digit code. The code is sent to your phone (ntfy),
#   never printed here (this log is public).
# - give back: someone took over a name. Moves the player's scores, streak and rooms to a
#   fresh account with a new code (sent to your phone). Whoever had the name is signed out;
#   give the rightful player the new code and they type their name, then the code.
# - look up: what the game knows about a player (first day, scores, streak, rooms, recent chat,
#   reports). Sent to your phone, never printed here. Never includes IP addresses.
# - check play: is someone cheating? Compares their last few boards with everyone else's
#   (words nobody else found, the order words came in, pace, wrong tries) and flags anything odd.
# - block / unblock: a blocked player disappears from everyone else's leaderboards, room chat
#   and the public room list. They can still play and still see themselves, so nothing tips them off.
# - set streak: put back a streak that was lost (enter the days, counting today if they've played today).
# - restore today: rebuild today's progress after it was lost: every word except the ones they
#   hadn't found, given as lengths (e.g. 5,5,6,4); the best word of each length is left out.
# - message: a note the player sees in a popup ("A message from Lettertown") the next time they open the game.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Player name'
        required: true
      action:
        description: 'What to do'
        type: choice
        options: [rename, look up, check play, block, unblock, message, send code, give back, set streak, restore today]
        default: rename
      new_name:
        description: 'New name (rename only, optional)'
        required: false
      message:
        description: 'Message to show the player next time they open the game (message only)'
        required: false
      days:
        description: 'Streak in days (set streak only)'
        required: false
      missed:
        description: 'Lengths of the words they had not found, e.g. 5,5,6,4 (restore today only)'
        required: false
      code:
        description: 'Code to set, 4 digits (send code / give back only, optional; made up if empty)'
        required: false

permissions:
  contents: read

jobs:
  moderate:
    runs-on: ubuntu-latest
    steps:
      - name: Run
        env:
          KEY: ${{ secrets.NTFY_TOPIC }}
          TOKEN: ${{ secrets.NTFY_TOKEN }}
          NAME: ${{ inputs.name }}
          ACTION: ${{ inputs.action }}
          TO: ${{ inputs.new_name }}
          DAYS: ${{ inputs.days }}
          MISSED: ${{ inputs.missed }}
        run: |
          # The chosen code is read from the event file (not step env) and masked, so it never shows in this public log.
          code_in=$(jq -r '.inputs.code // ""' "$GITHUB_EVENT_PATH"); [ -n "$code_in" ] && echo "::add-mask::$code_in"
          text_in=$(jq -r '.inputs.message // ""' "$GITHUB_EVENT_PATH")
          body=$(jq -n --arg key "$KEY" --arg name "$NAME" --arg action "$ACTION" --arg to "$TO" --arg code "$code_in" --arg text "$text_in" --arg days "$DAYS" --arg missed "$MISSED" \
            '{key: $key, name: $name, action: $action} + (if $to == "" or $action != "rename" then {} else {to: $to} end)
              + (if $code == "" or ($action != "send code" and $action != "give back") then {} else {code: $code} end)
              + (if $action == "message" then {text: $text} else {} end)
              + (if $action == "set streak" then {days: ($days | tonumber? // 0)} else {} end)
              + (if $action == "restore today" then {missed: $missed} else {} end)')
          res=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/json' -d "$body" \
            https://word-game-leaderboard.danlagstein.workers.dev/api/admin/moderate)
          status=$(tail -n1 <<<"$res"); json=$(sed '$d' <<<"$res")
          if [ "$status" != 200 ] || [ "$ACTION" = rename ] || [ "$ACTION" = block ] || [ "$ACTION" = unblock ] || [ "$ACTION" = message ] || [ "$ACTION" = "set streak" ] || [ "$ACTION" = "restore today" ]; then
            # These results and errors hold nothing private.
            jq 'del(.code, .report)' <<<"$json" 2>/dev/null || echo "$json"
            echo "HTTP $status"; [ "$status" = 200 ]; exit
          fi
          player=$(jq -r .name <<<"$json")
          if [ "$ACTION" = "look up" ] || [ "$ACTION" = "check play" ]; then
            title="$([ "$ACTION" = "look up" ] && echo Player || echo "Play check"): $player"; msg=$(jq -r .report <<<"$json")
          else
            code=$(jq -r .code <<<"$json"); echo "::add-mask::$code"
            title="Player code"
            msg="Code for $player: $code. They type their name, then this code. Send it only to them."
            [ "$ACTION" = "give back" ] && msg="$player was moved to a fresh account; whoever else had it is signed out. New code: $code. They type their name, then this code."
          fi
          auth=()
          [ -n "$TOKEN" ] && auth=(-H "Authorization: Bearer $TOKEN")
          body=$(jq -n --arg topic "$KEY" --arg title "$title" --arg message "$msg" '{topic: $topic, title: $title, message: $message, tags: ["mag"]}')
          curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d "$body" https://ntfy.sh/ > /dev/null ||
            { echo "::warning::ntfy refused the token; sent without it. Check NTFY_TOKEN."; curl -fsS -H 'Content-Type: application/json' -d "$body" https://ntfy.sh/ > /dev/null; }
          echo "Done: sent to your phone."
