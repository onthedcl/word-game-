name: Stats

# Read-only summary of how play is going: the public leaderboards and the onboarding
# funnel for the last week. Run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      API: https://word-game-leaderboard.danlagstein.workers.dev
    steps:
      - name: Leaderboards
        run: |
          for n in 7 6 5 4 3 2 1 0; do
            d=$(TZ=America/New_York date -d "$n days ago" +%F)
            echo "DAILY $d"; curl -fsS "$API/api/daily?date=$d" || true; echo
          done
          echo "BLITZ"; curl -fsS "$API/api/blitz" || true; echo
      - name: Onboarding funnel (last week, Eastern)
        env:
          KEY: ${{ secrets.NTFY_TOPIC }}
        run: |
          for n in 7 6 5 4 3 2 1 0; do
            d=$(TZ=America/New_York date -d "$n days ago" +%F)
            echo "FUNNEL $d $(curl -fsS -H 'Content-Type: application/json' -d "$(jq -n --arg key "$KEY" --arg day "$d" '{key: $key, day: $day}')" "$API/api/admin/funnel" || true)"
          done
