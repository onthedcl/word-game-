name: Deploy

# Builds the game and publishes it to the gh-pages branch (GitHub Pages), then
# deploys the leaderboard Worker to Cloudflare if a CLOUDFLARE_API_TOKEN secret is set.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so answer tables always exist well ahead of the calendar.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Leaderboard server (Cloudflare Worker). The game hides leaderboard features if it isn't answering.
          VITE_API_BASE: https://word-game-leaderboard.danlagstein.workers.dev
      - name: Build leaderboard answer tables
        run: npx vite-node scripts/build-scores.ts dist/scores
      - name: Publish dist/ to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  worker:
    runs-on: ubuntu-latest
    needs: pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add a CLOUDFLARE_API_TOKEN repository secret to deploy the leaderboard Worker."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy leaderboard Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy
      - name: Set the notification channel
        if: env.CLOUDFLARE_API_TOKEN != '' && env.NTFY_TOPIC != ''
        working-directory: worker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: printf '%s' "$NTFY_TOPIC" | npx wrangler secret put NTFY_TOPIC
      - name: Check the leaderboard answers the game
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          API: https://word-game-leaderboard.danlagstein.workers.dev
          GAME: https://onthedcl.github.io
          SCORES: https://onthedcl.github.io/${{ github.event.repository.name }}/scores
        run: |
          set -e
          today=$(date -u +%F)
          curl -fsS "$API/" | grep -q "leaderboard is running"
          # Read-only API calls, with the game's origin so CORS is checked too.
          curl -fsS -D headers.txt -H "Origin: $GAME" "$API/api/daily?date=$today&player=ci-check" -o daily.json
          grep -qi "access-control-allow-origin: $GAME" headers.txt
          grep -q '"total"' daily.json
          curl -fsS -H "Origin: $GAME" "$API/api/blitz?player=ci-check" | grep -q '"total"'
          # The answer tables the Worker scores against must be published.
          curl -fsS "$SCORES/daily/$today.json" | grep -q maxScore
          curl -fsS "$SCORES/blitz-pool.json" | grep -q pool-
          echo "Leaderboard OK: $(cat daily.json)"
      - name: Send a test notification (manual runs only)
        if: github.event_name == 'workflow_dispatch' && env.NTFY_TOPIC != ''
        run: |
          curl -fsS -H "Title: DPIYF Lettertown" -H "Tags: white_check_mark" \
            -d "Notifications are on. You'll get a ping when people play." "https://ntfy.sh/$NTFY_TOPIC" > /dev/null
