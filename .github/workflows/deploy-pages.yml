name: Deploy

# Deploys the leaderboard Worker to Cloudflare, builds the answer tables and uploads them to it
# (the only place they're kept: never the website or this public log), then builds the game
# and publishes it to the gh-pages branch (GitHub Pages).
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so answer tables always exist well ahead of the calendar.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    needs: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Game server (Cloudflare Worker): it deals the boards and checks words.
          VITE_API_BASE: https://word-game-leaderboard.danlagstein.workers.dev
          # The game moved to dpiyf.com: this copy sends players there (with their data) once it's live.
          VITE_MOVED_TO: https://dpiyf.com
      - name: Build the dpiyf.com copy
        run: npm run build -- --outDir dist-site && cp site/_headers dist-site/_headers
        env:
          BASE_PATH: /
          VITE_API_BASE: https://word-game-leaderboard.danlagstein.workers.dev
          VITE_GAME_URL: https://dpiyf.com/
      - name: Publish dpiyf.com (Cloudflare)
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          # dpiyf.com and www.dpiyf.com, once the domain is on this Cloudflare account. Until then
          # (or if the token can't manage the domain yet), the site still goes up at its workers.dev address.
          python3 - <<'PY'
          s = open('../site/wrangler.toml').read()
          routes = 'routes = [\n  { pattern = "dpiyf.com", custom_domain = true },\n  { pattern = "www.dpiyf.com", custom_domain = true },\n]\n\n'
          open('../site/wrangler.domain.toml', 'w').write(s.replace('[assets]', routes + '[assets]', 1))
          PY
          if ! npx wrangler deploy --config ../site/wrangler.domain.toml; then
            echo "::warning::dpiyf.com isn't connected to Cloudflare yet (or the token can't manage it): published at the workers.dev address only."
            npx wrangler deploy --config ../site/wrangler.toml
          fi
      - name: Keep the app preview (published separately from the app-store branch)
        run: |
          if git clone -q --depth 1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" old-site && [ -d old-site/preview ]; then
            cp -r old-site/preview dist/preview
          else
            echo "No preview to keep"
          fi
          rm -rf old-site
      - name: Publish dist/ to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      GH_NOTIFY_TOKEN: ${{ secrets.GH_NOTIFY_TOKEN }}
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add a CLOUDFLARE_API_TOKEN repository secret to deploy the leaderboard Worker."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != ''
      - run: npm test
        if: env.CLOUDFLARE_API_TOKEN != ''
      - name: Deploy leaderboard Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          npm install --no-audit --no-fund
          # Sign-in project: wrangler.toml's, unless a repository variable says otherwise.
          if [ -n "$FIREBASE_PROJECT_ID" ]; then npx wrangler deploy --var "FIREBASE_PROJECT_ID:${FIREBASE_PROJECT_ID}"; else npx wrangler deploy; fi
      - name: Set the notification channel
        if: env.CLOUDFLARE_API_TOKEN != '' && env.NTFY_TOPIC != ''
        working-directory: worker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: printf '%s' "$NTFY_TOPIC" | npx wrangler secret put NTFY_TOPIC
      - name: Set the ntfy access token
        if: env.CLOUDFLARE_API_TOKEN != '' && env.NTFY_TOKEN != ''
        working-directory: worker
        run: printf '%s' "$NTFY_TOKEN" | npx wrangler secret put NTFY_TOKEN
      - name: Set the GitHub token for relaying pings
        if: env.CLOUDFLARE_API_TOKEN != '' && env.GH_NOTIFY_TOKEN != ''
        working-directory: worker
        run: printf '%s' "$GH_NOTIFY_TOKEN" | npx wrangler secret put GH_NOTIFY_TOKEN
      - name: Build and upload the answer tables (kept only on the leaderboard server)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.NTFY_TOPIC != ''
        env:
          API: https://word-game-leaderboard.danlagstein.workers.dev
        run: |
          set -e
          # The secret new boards are made with lives on the server; it's masked so it never shows here.
          body=$(jq -n --arg key "$NTFY_TOPIC" '{key: $key}')
          # A fresh deploy can take a little while to reach every Cloudflare server, so keep asking.
          for i in $(seq 1 20); do
            secret=$(curl -fsS -H 'Content-Type: application/json' -d "$body" "$API/api/admin/board-secret" 2>/dev/null | jq -r '.secret // empty')
            [ -n "$secret" ] && break
            sleep 10
          done
          echo "::add-mask::$secret"
          [ ${#secret} -ge 32 ] || { echo "No board secret"; exit 1; }
          BOARD_SECRET="$secret" npx vite-node scripts/build-scores.ts private/scores
          API="$API" ADMIN_KEY="$NTFY_TOPIC" npx vite-node scripts/upload-tables.ts private/scores
          rm -rf private
      - name: Check the leaderboard answers the game
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          API: https://word-game-leaderboard.danlagstein.workers.dev
          GAME: https://onthedcl.github.io
        run: |
          set -e
          today=$(TZ=America/New_York date +%F)
          curl -fsS "$API/" | grep -q "leaderboard is running"
          # Read-only API calls, with the game's origin so CORS is checked too.
          curl -fsS -D headers.txt -H "Origin: $GAME" "$API/api/board?date=$today&player=ci-check" -o board.json
          grep -qi "access-control-allow-origin: $GAME" headers.txt
          # Today's board is dealt: letters and totals, but no answers while it's open.
          jq -e '.board.letters | length == 19' board.json > /dev/null
          jq -e 'has("answers") | not' board.json > /dev/null
          curl -fsS -H "Origin: $GAME" "$API/api/daily?date=$(jq -r .boardId board.json)&player=ci-check" | grep -q '"total"'
          curl -fsS -H "Origin: $GAME" "$API/api/blitz?player=ci-check" | grep -q '"total"'
          echo "Leaderboard OK: board #$(jq -r .number board.json) for $today, $(jq -r .total board.json) words"
      - name: Send a test notification through the Worker (manual runs only)
        if: github.event_name == 'workflow_dispatch' && env.NTFY_TOPIC != ''
        env:
          API: https://word-game-leaderboard.danlagstein.workers.dev
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' -d "{\"topic\":\"$NTFY_TOPIC\"}" "$API/api/notify-test" > /dev/null
          echo "Notification status: $(curl -fsS "$API/api/notify-status")"
