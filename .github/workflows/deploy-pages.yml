name: Deploy

# Builds the game and publishes it to the gh-pages branch (GitHub Pages), then
# deploys the leaderboard Worker to Cloudflare if a CLOUDFLARE_API_TOKEN secret is set.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so answer tables always exist well ahead of the calendar.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Leaderboard server (Cloudflare Worker). The game hides leaderboard features if it isn't answering.
          VITE_API_BASE: https://word-game-leaderboard.danlagstein.workers.dev
      - name: Build leaderboard answer tables
        run: npx vite-node scripts/build-scores.ts dist/scores
      - name: Publish dist/ to gh-pages
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  worker:
    runs-on: ubuntu-latest
    needs: pages
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add a CLOUDFLARE_API_TOKEN repository secret to deploy the leaderboard Worker."
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
      - name: Deploy leaderboard Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy
