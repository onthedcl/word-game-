name: Notify

# Relays "someone is playing" pings from the leaderboard Worker to ntfy.sh.
# ntfy's free plan refuses pushes from Cloudflare's shared IPs, but accepts
# them from GitHub's runners. The Worker triggers this with a repository_dispatch.
on:
  repository_dispatch:
    types: [notify]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send to ntfy
        env:
          # Passed through env (never pasted into the script) so player names can't inject shell.
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          TOKEN: ${{ secrets.NTFY_TOKEN }}
          TITLE: ${{ github.event.client_payload.title }}
          MESSAGE: ${{ github.event.client_payload.message }}
          TAGS: ${{ github.event.client_payload.tags }}
        run: |
          body=$(jq -n --arg topic "$TOPIC" --arg title "$TITLE" --arg message "$MESSAGE" --arg tags "$TAGS" \
            '{topic: $topic, title: $title, message: $message, tags: ($tags | split(",") | map(select(. != ""))),
              click: "https://onthedcl.github.io/word-game-/"}')
          auth=()
          [ -n "$TOKEN" ] && auth=(-H "Authorization: Bearer $TOKEN")
          curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d "$body" https://ntfy.sh/ > /dev/null
