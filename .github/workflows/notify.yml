name: Notify

# Relays "someone is playing" pings from the leaderboard Worker to ntfy.sh.
# ntfy's free plan refuses pushes from Cloudflare's shared IPs, but accepts
# them from GitHub's runners. The Worker triggers this with a repository_dispatch.
on:
  repository_dispatch:
    types: [notify]

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send to ntfy
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          # The message is read from the event file, not step env, so it never shows in this public log.
          body=$(jq --arg topic "$TOPIC" '.client_payload as $p |
            {topic: $topic, title: $p.title, message: $p.message, tags: (($p.tags // "") | split(",") | map(select(. != ""))),
             click: "https://onthedcl.github.io/word-game-/"}' "$GITHUB_EVENT_PATH")
          auth=()
          [ -n "$TOKEN" ] && auth=(-H "Authorization: Bearer $TOKEN")
          curl -fsS "${auth[@]}" -H 'Content-Type: application/json' -d "$body" https://ntfy.sh/ > /dev/null
